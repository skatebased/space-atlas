name: Refresh dataset

# Re-scrapes Wikipedia/Wikidata weekly and commits the result if anything
# changed. The scraper refuses to write a suspiciously small dataset, so a
# broken upstream edit leaves the committed data untouched.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The change feed diffs consecutive dataset revisions, so it needs
          # history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape Wikipedia capability layer
        run: node scripts/scrape.mjs

      - name: Build unified dataset
        env:
          # SEC rejects generic user agents; without this EDGAR is skipped.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/build-dataset.mjs

      - name: Build change feed
        run: node scripts/build-changelog.mjs

      - name: Validate output
        run: node scripts/validate.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No dataset changes."
            exit 0
          fi

          count=$(node -e "process.stdout.write(String(require('./data/organisations.json').organisations.length))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh dataset (${count} organisations)"
          git push
